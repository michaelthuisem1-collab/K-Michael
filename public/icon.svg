<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.25" />
  
  <!-- Directory / Community Symbol -->
  <!-- Mountain contours representing the Tangkhul highlands -->
  <path d="M96 360 L180 230 L256 320 L330 200 L416 360 Z" fill="#1e293b" opacity="0.25" />
  <path d="M112 360 L184 246 L248 334 L324 220 L400 360 Z" fill="url(#accent)" opacity="0.35" />

  <!-- Central Emblem: Directory Book / Shield & Community Hub -->
  <g transform="translate(136, 120)">
    <!-- Book / Register base -->
    <rect x="20" y="30" width="200" height="240" rx="16" fill="#ffffff" />
    <rect x="36" y="54" width="128" height="12" rx="6" fill="#1e40af" />
    <rect x="36" y="78" width="168" height="8" rx="4" fill="#94a3b8" />
    <rect x="36" y="98" width="144" height="8" rx="4" fill="#cbd5e1" />
    <rect x="36" y="118" width="160" height="8" rx="4" fill="#cbd5e1" />
    
    <!-- Village pin / checkmark emblem -->
    <circle cx="120" cy="190" r="38" fill="#1e40af" />
    <!-- Pin icon / home -->
    <path d="M120 166 L144 186 L134 186 L134 210 L106 210 L106 186 L96 186 Z" fill="#ffffff" />
    <rect x="114" y="196" width="12" height="14" fill="#38bdf8" />
  </g>
  
  <!-- 4 Region dots representing Ato, Zingsho, Zingtun, Aze -->
  <circle cx="128" cy="420" r="10" fill="#38bdf8" />
  <circle cx="213" cy="420" r="10" fill="#93c5fd" />
  <circle cx="298" cy="420" r="10" fill="#60a5fa" />
  <circle cx="384" cy="420" r="10" fill="#38bdf8" />
</svg>
